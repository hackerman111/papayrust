[package]
name = "papayrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
default-run = "papayrust"

[lib]
name = "papyrus_cli"
path = "src/lib.rs"

[[bin]]
name = "papayrust"
path = "src/main.rs"

[[bin]]
name = "papyrus"
path = "src/bin/papyrus.rs"

[dependencies]
papyrus-core = { path = "../papyrus-core" }
papyrus-tui = { path = "../papyrus-tui" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
lopdf = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
zip = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "phase9_cli"
path = "../../tests/phase9_cli.rs"

[[test]]
name = "phase11_acceptance"
path = "../../tests/phase11_acceptance.rs"

[[test]]
name = "cli_config_discovery"
path = "../../tests/cli_config_discovery.rs"
